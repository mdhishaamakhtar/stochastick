<!doctype html>
<meta charset="utf-8">
<title>og-gen</title>
<style>
  @font-face { font-family: 'Bungee'; font-weight: 400; src: url('/fonts/bungee-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Martian Mono'; font-weight: 400; src: url('/fonts/martian-mono-latin-400.woff2') format('woff2'); }
  @font-face { font-family: 'Martian Mono'; font-weight: 700; src: url('/fonts/martian-mono-latin-700.woff2') format('woff2'); }
  body { background: #333; margin: 0; }
  canvas { outline: 1px solid #666; }
</style>
<canvas id="og" width="2400" height="1260" style="width:1200px;height:630px"></canvas>
<script type="module">
import { makeBullSprite, makeBearSprite } from '/src/game/render.ts';

const c = document.getElementById('og');
const x = c.getContext('2d');
x.scale(2, 2); // author in 1200x630 space, export at 2x for retina-crisp README

await Promise.all([
  document.fonts.load('400 88px "Bungee"'),
  document.fonts.load('700 28px "Martian Mono"'),
  document.fonts.load('400 20px "Martian Mono"'),
]);
await document.fonts.ready;

// ---- background + chart grid
x.fillStyle = '#0a0b13';
x.fillRect(0, 0, 1200, 630);
x.strokeStyle = 'rgba(35, 39, 57, 0.6)';
x.lineWidth = 1;
for (let gx = 0.5; gx <= 1200; gx += 48) { x.beginPath(); x.moveTo(gx, 0); x.lineTo(gx, 630); x.stroke(); }
for (let gy = 0.5; gy <= 630; gy += 48) { x.beginPath(); x.moveTo(0, gy); x.lineTo(1200, gy); x.stroke(); }

// ---- right side: candle obstacle pairs (same construction as the game)
function pair(cx, gapTop, gapBot, up) {
  const body = up ? '#22d68e' : '#ff5964';
  const dim = up ? '#0e3626' : '#3c1a22';
  const w = 92, hw = w / 2;
  x.fillStyle = dim; x.fillRect(cx - hw, 0, w, gapTop);
  x.fillStyle = body; x.fillRect(cx - hw, gapTop - 8, w, 8); x.fillRect(cx - 4, gapTop, 8, 34);
  x.strokeStyle = body; x.lineWidth = 2.5;
  x.strokeRect(cx - hw + 1.5, 1.5, w - 3, gapTop - 3);
  x.fillStyle = dim; x.fillRect(cx - hw, gapBot, w, 630 - gapBot);
  x.fillStyle = body; x.fillRect(cx - hw, gapBot, w, 8); x.fillRect(cx - 4, gapBot - 34, 8, 34);
  x.strokeRect(cx - hw + 1.5, gapBot + 1.5, w - 3, 630 - gapBot - 3);
}
pair(860, 150, 420, true);
pair(1035, 250, 520, false);
pair(1185, 90, 360, true);

// ---- fighters mid-flight
const bull = makeBullSprite(2), bear = makeBearSprite(2);
x.fillStyle = '#dfe7f2';
for (const [px, py, s, a] of [[772, 322, 7, 0.8], [748, 338, 5, 0.55], [728, 354, 4, 0.35], [952, 452, 6, 0.6], [932, 468, 4, 0.4]]) {
  x.globalAlpha = a; x.fillRect(px, py, s, s);
}
x.globalAlpha = 1;
x.save(); x.translate(862, 288); x.rotate(-0.18); x.drawImage(bull, -62, -62, 124, 124); x.restore();
x.save(); x.translate(1038, 392); x.rotate(0.14); x.drawImage(bear, -56, -56, 112, 112); x.restore();

// ---- left side: wordmark + copy
const L = 84;
x.textBaseline = 'alphabetic';
x.font = '400 82px "Bungee"';
x.fillStyle = '#f0f2f9';
x.fillText('STOCHAST', L, 296);
const w1 = x.measureText('STOCHAST').width;
x.fillStyle = '#8f7bff';
x.fillText('ICK', L + w1, 296);

x.font = '700 28px "Martian Mono"';
x.fillStyle = '#f0f2f9';
x.fillText('Flappy Bird on real stock candles.', L, 356);

x.font = '400 20px "Martian Mono"';
x.fillStyle = '#9ba1b8';
x.fillText('Fly a bull or a bear through real NSE charts.', L, 398);
x.fillText('54 stocks & indices · 4 timeframes.', L, 430);

x.fillStyle = '#22d68e'; x.fillRect(L, 468, 64, 4);
x.fillStyle = '#8f7bff'; x.fillRect(L + 76, 468, 24, 4);
x.fillStyle = '#ff5964'; x.fillRect(L + 112, 468, 24, 4);

x.font = '400 20px "Martian Mono"';
x.fillStyle = '#6e7681';
x.fillText('stochastick.hishaam.dev', L, 552);

window.OG = c.toDataURL('image/png');
document.title = 'ready:' + window.OG.length;
</script>
